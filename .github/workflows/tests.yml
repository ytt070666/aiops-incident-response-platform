name: Test API

on:
  push:
  pull_request:

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Python container
        run: docker build -t aiops-python-api .
  java-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alert-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Java tests
        run: mvn test
      - name: Build Java container
        run: docker build -t aiops-alert-service .
  vue-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Vue console
        run: npm install && npm run build
